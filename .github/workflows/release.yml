# Change the version on the first line of VERSION.txt, push, and this
# publishes the release by itself (tagged v<version>):
#
#   Squint.zip + version.json   what the in-app updater downloads
#   Squint-Setup.exe            the one-time installer for new users
#
# Existing users never need the exe again: the app reads version.json from
# the latest release and replaces its own code. Nobody has to hand out files.
#
# The installer is built on Linux on purpose: tools/make_installer.py puts
# Windows' own embeddable Python and Windows wheels into it with uv, and
# NSIS packs it. No Windows machine is involved.

name: Release

on:
  push:
    branches: [main]
    paths: [VERSION.txt, .github/workflows/release.yml, "installer/**", tools/make_release.py, tools/make_installer.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(head -1 VERSION.txt | sed -E 's/^Squint //; s/[[:space:]]+$//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.v.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Tools
        if: steps.v.outputs.skip != '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis
          pip install uv

      - name: Test the tools menu
        if: steps.v.outputs.skip != '1'
        run: |
          pip install -q pillow PyMuPDF python-docx
          python -m unittest tests.test_radial -v

      - name: Update package (Squint.zip, version.json)
        if: steps.v.outputs.skip != '1'
        run: python tools/make_release.py --out dist

      - name: Installer (Squint-Setup.exe)
        if: steps.v.outputs.skip != '1'
        run: |
          set -o pipefail
          if ! python tools/make_installer.py 2>&1 | tee installer.log; then
            # The tail of the log as an annotation, readable from the API.
            msg=$(tail -n 40 installer.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=installer::$msg"
            exit 1
          fi
          # One name for every version, so the share link never changes.
          mv dist-installer/Squint-Setup-*.exe dist-installer/Squint-Setup.exe

      - name: Publish
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Squint $VERSION" \
            --notes-file dist/RELEASE_NOTES.md \
            --latest \
            dist/Squint.zip dist/version.json \
            dist-installer/Squint-Setup.exe

  # The Mac disk images, built on GitHub's Macs and added to the same
  # release (Apple Silicon and Intel).
  mac:
    needs: release
    if: needs.release.outputs.skip != '1'
    uses: ./.github/workflows/mac-dmg.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets: inherit
